<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telecom analytics portfolio</title><style>
body{font:16px system-ui;background:#f1f5f9;color:#13243c;margin:0}main{max-width:1180px;margin:auto;padding:36px}h1{font-size:34px;margin:8px 0}small{color:#48617c}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}.card,section{background:white;padding:22px;border:1px solid #dbe4ef;border-radius:14px}.value{font-size:30px;font-weight:700;color:#126a70}select{padding:10px;margin:15px 20px 0 5px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}th{color:#48617c}.bar{height:18px;background:#17848b;border-radius:3px}label{display:inline-block}section{overflow:auto}@media(max-width:750px){.cards{grid-template-columns:1fr 1fr}main{padding:16px}}
</style><main><small>AKASH YEGINATI / BUSINESS INTELLIGENCE PORTFOLIO</small><h1 id="title"></h1><p>Synthetic demonstration data. Findings are illustrative; no real subscriber or operator information.</p>
<label>Region <select id="region" aria-label="Region"></select></label><label>Period <select id="period" aria-label="Period"></select></label><div class="cards" id="cards"></div><section><h2>Regional comparison</h2><div id="chart"></div><h2>Filtered observations</h2><table id="table"></table></section></main>
<script>
const p=__PAYLOAD__;const $=id=>document.getElementById(id);$('title').textContent=p.title;
for(const [id,field] of [['region','region'],['period',p.period]]){for(const v of ['All',...new Set(p.rows.map(x=>x[field]))]){const o=document.createElement('option');o.value=v;o.textContent=v;$(id).append(o)}$(id).onchange=render}
function total(rows,col){return rows.reduce((s,x)=>s+(+x[col]||0),0)}
function metric(rows,m){const n=total(rows,m.numerator);return m.denominator?(total(rows,m.denominator)?n/total(rows,m.denominator)*m.scale:null):n}
function fmt(v,m){if(v===null)return 'N/A';return m.format==='percent'?v.toFixed(2)+'%':m.format==='currency'?'INR '+v.toLocaleString('en-IN',{maximumFractionDigits:0}):v.toLocaleString('en-IN',{maximumFractionDigits:2})}
function render(){let rows=p.rows.filter(x=>($('region').value==='All'||x.region===$('region').value)&&($('period').value==='All'||x[p.period]===$('period').value));$('cards').replaceChildren();for(const m of p.metrics){let d=document.createElement('div');d.className='card';let label=document.createElement('div');label.textContent=m.label;let v=document.createElement('div');v.className='value';v.textContent=fmt(metric(rows,m),m);d.append(label,v);$('cards').append(d)}let regions=[...new Set(rows.map(x=>x.region))];let vals=regions.map(r=>metric(rows.filter(x=>x.region===r),p.metrics[0]));$('chart').replaceChildren();regions.forEach((r,i)=>{let d=document.createElement('p');d.textContent=r+' — '+fmt(vals[i],p.metrics[0]);let b=document.createElement('div');b.className='bar';b.style.width=(Math.max(...vals)?100*vals[i]/Math.max(...vals):0)+'%';d.append(b);$('chart').append(d)});$('table').replaceChildren();if(rows.length){const cols=Object.keys(rows[0]);const head=document.createElement('tr');cols.forEach(c=>{let th=document.createElement('th');th.textContent=c;head.append(th)});$('table').append(head);rows.forEach(x=>{let tr=document.createElement('tr');cols.forEach(c=>{let td=document.createElement('td');td.textContent=typeof x[c]==='number'?x[c].toLocaleString('en-IN',{maximumFractionDigits:2}):x[c];tr.append(td)});$('table').append(tr)})}}
render();</script></html>
